<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Security policy: nothing may be sent anywhere. The only network reads allowed are this app's own
     Scan-to-fill engine files in ./ocr/ (narrowed by the second policy added just below). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<script>
/* Second, stricter policy: fetches may only go to this app's own ocr/ folder (or nowhere, when opened as a local file).
   Both policies apply, so the effective rule is the narrower one. */
(function () {
  var m = document.createElement('meta'); m.httpEquiv = 'Content-Security-Policy';
  m.content = /^https?:$/.test(location.protocol) ? 'connect-src ' + location.origin + location.pathname.replace(/[^\/]*$/, '') + 'ocr/' : "connect-src 'none'";
  document.head.appendChild(m);
})();
</script>
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#16191d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tijori">
<title>Tijori · Private Document Cabinet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 140'%3E%3Crect x='10' y='6' width='100' height='126' rx='8' fill='%23474e58'/%3E%3Crect x='18' y='20' width='84' height='30' rx='4' fill='%23808994'/%3E%3Crect x='18' y='56' width='84' height='30' rx='4' fill='%23808994'/%3E%3Crect x='18' y='92' width='84' height='30' rx='4' fill='%23808994'/%3E%3Crect x='44' y='25' width='32' height='10' fill='%23d9b45a'/%3E%3Crect x='44' y='61' width='32' height='10' fill='%23d9b45a'/%3E%3Crect x='44' y='97' width='32' height='10' fill='%23d9b45a'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#121417;--ink:#e8ebef;--muted:#98a2ae;--line:#2c3138;
  --paper:#f7f1e3;--paper-ink:#2a251d;--paper-muted:#7a6f5c;
  --manila:#eccf8e;--brass1:#e6c46e;--brass2:#9c7526;
  --red:#e5484d;--amber:#f0a020;--green:#2f9e68;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1100px 520px at 50% -120px,#2b3139 0%,#16191d 60%,#101214 100%) fixed;color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.veil #app{filter:blur(22px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
code{font-family:var(--mono);font-size:.92em;background:#ffffff14;padding:1px 5px;border-radius:5px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px 16px;background:rgba(18,20,23,.84);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:750;letter-spacing:.03em;font-size:18px;line-height:1.1}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.05em}
.brand svg{width:28px;height:32px}
.top-actions{display:flex;gap:2px}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;position:relative;color:#cfd5dc;text-decoration:none}
.ib:hover{background:#ffffff10}
.badge{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:750;display:grid;place-items:center}
.scanbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-4px 0 18px;padding:12px 14px;border-radius:12px;background:linear-gradient(180deg,#fff8e6,#f6ebcd);border:1px solid #e3cf9b}
.scanbar .sb-t{flex:1;min-width:190px}
.scanbar b{display:block;font-size:14.5px}
.scanbar small{display:block;color:var(--paper-muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.scanbar .btns{justify-content:flex-start}
.sg-list{display:grid;gap:8px;margin:4px 0 0}
.sg{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:9px 10px;border-radius:10px;background:#ffffff08;border:1px solid #2f353d}
.sg input[type=checkbox]{width:19px;height:19px;accent-color:#e6c46e;grid-row:span 2}
.sg .sg-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.sg .sg-l em{font-style:normal;color:#f6c560;text-transform:none;letter-spacing:0;margin-left:6px}
.sg .sg-v{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #39404a;background:#0f1114;color:var(--ink);font:15px var(--sans)}
.sg .sg-v.mono{font-family:var(--mono)}
.sg small{grid-column:2;color:#f6c560;font-size:12px}
.sg-attach{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px;color:#c9d0d8}
.sg-attach input{width:18px;height:18px;accent-color:#e6c46e}
.pbar{height:8px;border-radius:4px;background:#2a2f36;overflow:hidden;margin:6px 0 4px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass2),var(--brass1));transition:width .2s}
.fld input.filled,.fld textarea.filled{animation:filled 2.4s ease-out}
@keyframes filled{0%,40%{background:#fff0bf;border-color:#c8a24a}}
.ochips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.ochip{padding:7px 14px;border-radius:999px;border:1px solid #d6c8a6;background:#fffdf7;color:var(--paper-ink);font-size:14px;font-weight:600;cursor:pointer}
.ochip.on{background:#2a251d;color:#fff8e6;border-color:#2a251d}
.rawtext{margin-top:12px;font-size:13px;color:var(--muted)}
.rawtext summary{cursor:pointer;padding:4px 0}
.rawtext .btn{margin:6px 0 2px}
.rawtext pre{white-space:pre-wrap;word-break:break-word;font:12.5px/1.45 var(--mono);color:#c9d0d8;background:#0f1114;border:1px solid #2f353d;border-radius:8px;padding:10px;max-height:30vh;overflow:auto;margin:6px 0 0}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;margin:22px -8px 0;padding:10px;border-radius:14px;background:rgba(247,241,227,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 -2px 0 rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.28)}
.savebar .btn{flex:1 1 auto}
.sg small.src{color:var(--muted)}
.att.is-pdf::after{content:"PDF";position:absolute;left:6px;bottom:6px;z-index:1;font:700 10px/1 var(--sans);letter-spacing:.06em;padding:3px 6px;border-radius:5px;background:#b4232a;color:#fff}
.viewer-body.pdf{display:block;overflow:auto;-webkit-overflow-scrolling:touch;padding:0}
.pdfpages{width:100%;max-width:920px;margin:0 auto;padding:8px 8px 48px;display:flex;flex-direction:column;gap:12px}
.pdfpage{position:relative;width:100%;background:#fff;border-radius:3px;box-shadow:0 2px 12px rgba(0,0,0,.6);overflow:hidden}
.pdfpage img{display:block;width:100%;height:auto}
.pdfpage .pn{position:absolute;right:8px;bottom:6px;font:600 11px/1 var(--sans);color:#555;background:#ffffffd9;padding:3px 7px;border-radius:8px}
.pdf-status{color:#9aa3ad;text-align:center;padding:40px 16px;margin:0}
.upd{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:250;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 10px 12px 16px;border-radius:16px;background:#262b32;border:1px solid #e6c46e66;color:var(--ink);box-shadow:0 14px 34px rgba(0,0,0,.6);animation:rise .25s}
.upd small{color:var(--muted)}
.vbtn.danger{color:#ffb4b6}
.crow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) auto;gap:6px;margin-bottom:8px;align-items:center}
@media(max-width:480px){.crow{grid-template-columns:1fr auto}.crow .c-l,.crow .c-v{grid-column:1}.crow .mini{grid-column:2;grid-row:1/3}}
.cadd{display:flex;flex-wrap:wrap;gap:7px}
.dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 2px #16191d}
.banner .btn{flex:none}
.modal .small{font-size:13px;color:var(--muted)}
.view{max-width:820px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom))}

/* ---------- home ---------- */
.privacy-pill{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12.5px;color:#a9d8bf;background:#1f3a2d55;border:1px solid #2f9e6844;border-radius:999px;padding:6px 14px;margin:0 auto 16px;width:max-content;max-width:100%}
.privacy-pill .i{width:15px;height:15px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin:0 auto 12px;max-width:780px;text-decoration:none;border:1px solid}
.banner.warn{background:#3a2a0f88;border-color:#f0a02055;color:#f6d39a}
.banner.info{background:#1b2a3f88;border-color:#3b82f655;color:#b9d3fb}
.banner b{color:#fff}.banner small{opacity:.85}
.grow{flex:1;min-width:0}

.cabinet{max-width:780px;margin:6px auto 0;filter:drop-shadow(0 26px 30px rgba(0,0,0,.55))}
.cab-top{position:relative;height:22px;border-radius:12px 12px 3px 3px;background:linear-gradient(180deg,#8f98a3,#626b76);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.25)}
.keyhole{position:absolute;left:50%;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1b1e22 0 2px,#c7ced6 2.5px 4px,#6c7580 4.5px)}
.cab-body{position:relative;padding:14px;display:grid;grid-template-columns:1fr;gap:12px;background:linear-gradient(90deg,#2f343b 0,#444b55 3%,#4a525c 50%,#444b55 97%,#2f343b 100%)}
.cab-body::before,.drawer::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);pointer-events:none;border-radius:inherit}
.cab-base{height:16px;margin:0 12px;border-radius:0 0 8px 8px;background:linear-gradient(#2a2e34,#17191c)}
@media(min-width:700px){.cab-body{grid-template-columns:1fr 1fr;padding:18px;gap:14px}}
.drawer{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;width:100%;min-height:104px;padding:14px 16px;border-radius:7px;background:linear-gradient(180deg,#848d99 0%,#69727d 48%,#5b646f 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -2px 0 rgba(0,0,0,.3),inset 0 0 0 1px rgba(0,0,0,.25),0 2px 0 #23272c,0 4px 8px rgba(0,0,0,.35);transition:transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .24s;transform-origin:50% 0}
.drawer:hover{transform:translateY(-1px)}
.drawer:focus-visible{outline:2px solid #9cc2ff;outline-offset:2px}
.drawer.pulling{transform:translateY(8px) scale(1.045);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -2px 0 rgba(0,0,0,.3),0 22px 30px rgba(0,0,0,.6);z-index:2}
.lh{width:min(270px,88%);padding:4px;border-radius:4px;background:linear-gradient(180deg,var(--brass1),var(--brass2));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1px 2px rgba(0,0,0,.55)}
.lc{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--paper-ink);border-radius:2px;padding:6px 10px;border-left:5px solid var(--accent);box-shadow:inset 0 1px 3px rgba(0,0,0,.2);text-align:left}
.lc-ic{font-size:22px;line-height:1}
.lc-t{min-width:0}
.lc-name{display:block;font:750 13.5px/1.25 var(--mono);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-count{display:block;font:12px/1.3 var(--mono);color:var(--paper-muted)}
.handle{width:96px;height:16px;border-radius:8px;background:linear-gradient(180deg,#f5f7f9 0%,#c3cad2 45%,#87909a 100%);box-shadow:0 3px 4px rgba(0,0,0,.5),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.25)}
.d-alert{position:absolute;top:8px;right:9px;font:750 10.5px/1 var(--sans);padding:4px 7px;border-radius:999px;background:var(--red);color:#fff;box-shadow:0 1px 2px #0008}
.d-alert.soon{background:var(--amber);color:#2a1a00}
.add-drawer{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px auto 0;padding:12px 18px;border-radius:14px;border:1.5px dashed #3d444e;color:var(--muted);width:100%;max-width:780px}
.add-drawer:hover{color:var(--ink);border-color:#5a636e}

.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:8px;padding:14px 20px;border-radius:18px;background:linear-gradient(180deg,var(--brass1),var(--brass2));color:#231a06;font-weight:750;text-decoration:none;box-shadow:0 12px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.5)}

/* ---------- generic ---------- */
.ph{display:flex;align-items:center;gap:10px;margin:0 0 18px}
.ph h1{flex:1;margin:0;font-size:21px;line-height:1.2;display:flex;align-items:center;gap:10px;min-width:0}
.ph .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#ffffff0d;border:1px solid var(--line);text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:650;background:#ffffff12;border:1px solid #ffffff1f;color:var(--ink);text-decoration:none;white-space:nowrap;cursor:pointer}
.btn .i{width:18px;height:18px}
.btn.primary{background:linear-gradient(180deg,var(--brass1),var(--brass2));color:#231a06;border-color:transparent}
.btn.danger{background:#e5484d22;border-color:#e5484d66;color:#ffb4b6}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.08);white-space:nowrap}
.chip .i{width:13px;height:13px}
.chip.expired{background:var(--red);color:#fff}
.chip.soon{background:var(--amber);color:#2a1a00}
.chip.upcoming{background:#f6d77a;color:#4a3500}
.chip.ok{background:#2f9e6826;color:#1f6b45}
.chip.ended{background:rgba(0,0,0,.08);color:#7a6f5c}
.dark .chip{background:#ffffff14}
.dark .chip.ok{background:#2f9e6826;color:#86d8ae}
.dark .chip.ended{background:#ffffff10;color:var(--muted)}
.dark .chip.expired{background:var(--red)}.dark .chip.soon{background:var(--amber)}.dark .chip.upcoming{background:#f6d77a}

/* ---------- drawer view ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;margin:-4px 0 14px;padding-bottom:4px}
.fchip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#ffffff08;font-size:13.5px;white-space:nowrap}
.fchip.on{background:var(--ink);color:#111;border-color:var(--ink)}
.tray{position:relative;border-radius:10px;padding:8px 14px 20px;background:linear-gradient(180deg,#1b1f24,#262b32);box-shadow:inset 0 0 0 7px #5d6570,inset 0 0 0 8px #2b3036,inset 0 16px 24px rgba(0,0,0,.6)}
.folder{position:relative;display:block;margin-top:36px;padding:14px 16px;text-decoration:none;color:#3b2e14;background:linear-gradient(180deg,#f2d99c 0%,var(--manila) 30%,#e2bf78 100%);border-radius:2px 9px 9px 9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 0 #b38c45,0 8px 14px rgba(0,0,0,.45);transition:transform .2s;animation:rise .34s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n,0) * 35ms)}
.folder:hover{transform:translateY(-3px)}
.ftab{position:absolute;top:-27px;height:29px;max-width:58%;padding:6px 12px 0;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#f6e1ac,#f2d99c);font:750 12.5px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#3b2e14;box-shadow:0 -1px 2px rgba(0,0,0,.2)}
.ftab::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);margin-right:7px;vertical-align:0}
.f-type{display:block;font-size:11.5px;color:#7a6236;text-transform:uppercase;letter-spacing:.06em;font-weight:750}
.f-main{display:block;font:650 15.5px/1.3 var(--mono);margin:4px 0 9px;word-break:break-all}
.f-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.empty{text-align:center;padding:40px 16px 24px;color:#c9b88f}
.empty .big{font-size:46px;line-height:1;margin-bottom:10px}
.empty p{margin:0 0 16px;color:var(--muted)}

/* ---------- open folder / sheet ---------- */
.fo{position:relative;margin-top:30px;padding:10px;border-radius:2px 12px 12px 12px;background:linear-gradient(#efd393,#dcb76d);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.fo>.ftab{left:0;max-width:80%}
.sheet{position:relative;display:block;background:var(--paper);color:var(--paper-ink);border-radius:4px 8px 8px 8px;padding:22px 20px;box-shadow:0 1px 3px rgba(0,0,0,.2);color-scheme:light}
@media(max-width:480px){.sheet{padding:18px 14px}}
.meta-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;color:var(--paper-muted);font-size:13.5px}
.rows{margin:0;border-top:1px dashed #cdbf9f}
.row{display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed #cdbf9f;align-items:center}
@media(max-width:480px){.row{grid-template-columns:1fr;gap:1px}}
.row dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-muted);font-weight:750}
.row dd{margin:0;display:flex;align-items:center;gap:6px;min-width:0}
.val{flex:1;min-width:0;word-break:break-word;font-size:15.5px}
.val.mono{font-family:var(--mono);letter-spacing:.02em}
.val a{color:#7a4f00}
.ra{display:flex;gap:2px}
.mini{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#6b5d44}
.mini:hover{background:rgba(0,0,0,.06)}
.mini .i{width:18px;height:18px}
.notes{white-space:pre-wrap;background:#fffaf0;border:1px solid #e6dbc2;border-radius:8px;padding:12px}
.sec{font:750 11.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--paper-muted);margin:24px 0 10px}
.muted-p{color:var(--paper-muted);margin:0;font-size:14px}
.muted-p a{color:#7a4f00}
.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.att{position:relative;aspect-ratio:1/1;border-radius:9px;overflow:hidden;background:#ece2ca;border:1px solid #d8caa8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;color:#6b5d44;font-size:11.5px;text-align:center}
.att img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.att .i{width:28px;height:28px}
.att .nm{word-break:break-all;max-height:2.8em;overflow:hidden;line-height:1.4}
.att .rm{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;z-index:1}
.att .rm .i{width:15px;height:15px}
.sheet-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.sheet-actions.end{justify-content:flex-end}
.sheet .btn{background:#00000009;border-color:#00000020;color:var(--paper-ink)}
.sheet .btn.primary{background:linear-gradient(180deg,var(--brass1),var(--brass2));color:#231a06;border-color:transparent}
.sheet .btn.danger{background:#e5484d14;color:#b4232a;border-color:#e5484d55}
.mv{font:inherit;font-size:13.5px;font-weight:650;padding:8px 10px;border-radius:10px;border:1px solid #00000020;background:#00000009;color:var(--paper-ink)}
.stamp{font-size:11.5px;color:var(--paper-muted);margin-top:16px}

.pcard::before{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-120px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.18),transparent 70%)}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;font-weight:750;gap:10px}
.pc-bank{font-size:15px}.pc-var{font-size:12px;opacity:.8;font-weight:500}
.pc-kind{font-size:10px;letter-spacing:.14em;opacity:.75}
.chipgold{width:42px;height:31px;border-radius:6px;background:linear-gradient(135deg,#f3dc8b,#b8913a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.pc-num{font:650 clamp(15px,5vw,20px)/1 var(--mono);letter-spacing:.08em;text-shadow:0 1px 1px rgba(0,0,0,.4);white-space:nowrap}
.pc-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.pc-bot small{display:block;font-size:8.5px;opacity:.7}
.pc-net{font:800 italic 17px/1 var(--sans);text-transform:none}

.form .grid{display:grid;gap:14px}

.fld input,.fld textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #d6c8a6;background:#fffdf7;color:var(--paper-ink);font:16px var(--sans);outline:none}
.fld textarea{resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:#a8822f;box-shadow:0 0 0 3px #c8a24a33}
.fld input.mono{font-family:var(--mono)}
.fld input.up{text-transform:uppercase}
.fld input.up::placeholder{text-transform:none}
.hint{font-size:12px;color:var(--paper-muted);margin-top:5px}
.att-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- dark panels ---------- */
.panel{background:linear-gradient(180deg,#1f2328,#1a1d21);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.panel h2 .i{color:#86d8ae}
.panel p{color:var(--muted);margin:6px 0 10px;font-size:14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.set-row small{font-size:12.5px}
select.dark{background:#111418;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#ffffff07;border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left;text-decoration:none}
.list-item:hover{background:#ffffff0d}
.li-ic{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--accent,#888) 24%,transparent)}
.li-t{flex:1;min-width:0}
.li-t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.li-t small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}

.tile small{color:var(--muted);font-size:12px;line-height:1.35}

.group-h:first-child{margin-top:0}
.search-wrap{position:relative;margin-bottom:16px}

.lock .btn{padding:14px;font-size:16px}
.err{color:#ff9a9d;font-size:13.5px;min-height:1.2em}

.promises li{display:flex;gap:9px;align-items:center}
.promises .i{width:16px;height:16px;color:#7fd3a8}
.strength{height:5px;border-radius:3px;background:#2a2f36;overflow:hidden}
.strength i{display:block;height:100%;width:0;transition:width .2s,background .2s}
.warnbox{font-size:12.5px;color:#f6d39a;background:#3a2a0f66;border:1px solid #f0a02044;border-radius:10px;padding:10px 12px}

.modal{width:100%;max-width:440px;background:#1d2126;border:1px solid #333a43;border-radius:18px;padding:20px;box-shadow:0 30px 60px rgba(0,0,0,.6);animation:rise .22s cubic-bezier(.2,.8,.2,1);margin-bottom:env(safe-area-inset-bottom)}
.modal h2{margin:0 0 10px;font-size:18px}
.modal p{color:#b9c1ca;margin:0 0 12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex:none}
.modal{max-height:calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:flex;flex-direction:column}
.modal h2{flex:none}
.modal-body{overflow:auto;min-height:0;flex:1 1 auto;margin:0 -6px;padding:0 6px;overscroll-behavior:contain}
.modal-actions{flex-wrap:wrap}
@media(max-width:480px){.modal-actions .btn{flex:1 1 auto}}

.mf label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.mf input{padding:11px 12px;border-radius:10px;border:1px solid #39404a;background:#0f1114;color:var(--ink);font-size:16px;outline:none;width:100%}
.mf input:focus{border-color:var(--brass1)}

.sw.on{outline:3px solid #fff;outline-offset:2px}

.toast.show{opacity:1;transform:translate(-50%,0)}
body:has(.modal-ov) .toast{bottom:auto;top:calc(16px + env(safe-area-inset-top))}
.viewer{position:fixed;inset:0;z-index:150;background:#000;display:flex;flex-direction:column;animation:fade .15s}
.viewer-bar{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px 16px;color:#fff}
.viewer-bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.vbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:#fff;background:#ffffff16;text-decoration:none}
.viewer-body{flex:1;display:grid;place-items:center;overflow:auto;padding:10px}
.viewer-body img{max-width:100%;max-height:calc(100vh - 90px);object-fit:contain}
.viewer-file{text-align:center;color:#ddd}
.viewer-file .i{width:60px;height:60px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- crypto ---------- */
async function deriveKey(pass, salt, iter = ITER) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptBytes(key, bytes) { const iv = crypto.getRandomValues(new Uint8Array(12)); return { iv, ct: new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes)) }; }
async function decryptBytes(key, rec) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: rec.iv }, key, rec.ct)); }

/* ---------- storage (IndexedDB) ---------- */
let dbp = null;
function db() {
  return dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('blobs'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => { dbp = null; rej(r.error); };
  }));
}
async function idb(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode); let out;
    const r = fn(tx.objectStore(store)); if (r) r.onsuccess = () => { out = r.result; };
    tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('Storage write failed — is the device full?'));
  });
}
const kvGet = k => idb('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => idb('kv', 'readwrite', s => s.put(v, k));
const blobGet = k => idb('blobs', 'readonly', s => s.get(k));
const blobSet = (k, v) => idb('blobs', 'readwrite', s => s.put(v, k));
const blobDel = k => idb('blobs', 'readwrite', s => s.delete(k));
const blobKeys = () => idb('blobs', 'readonly', s => s.getAllKeys());

function unbackedCount() {

}

/* ---------- sharing ---------- */
function canShareFiles(files) { try { return !!(navigator.canShare && navigator.canShare({ files })); } catch { return false; } }
async function shareFiles(files, title) {
  if (!canShareFiles(files)) {
    files.forEach(f => download(f, f.name));
    return toast('Sharing isn’t available in this browser, so it was saved to Downloads');
  }
  const go = () => navigator.share({ files, title });
  try { await go(); return true; }
  catch (e) {
    if (e.name === 'AbortError') return false;
    if (e.name === 'NotAllowedError') { // decrypting took long enough for the browser to want a fresh tap
      const ok = await modal({ title: 'Ready to share', html: `<p>${files.length} file${files.length > 1 ? 's' : ''} ready.</p>`, actions: [{ label: 'Cancel', value: false }, { label: 'Share', cls: 'primary', value: true }] });
      if (!ok) return false;
      try { await go(); return true; } catch (e2) { if (e2.name !== 'AbortError') toast('Couldn’t share: ' + e2.message); return false; }
    }
    toast('Couldn’t share: ' + e.message); return false;
  }
}
function shareName(a, title, i, n) {
  const ext = (a.name.match(/\.[a-z0-9]{2,5}$/i) || [a.mime === 'application/pdf' ? '.pdf' : '.jpg'])[0];
  const base = String(title || 'document').replace(/[\\/:*?"<>|]+/g, '').trim() || 'document';
  return `${base}${n > 1 ? ` (${i + 1})` : ''}${ext}`;
}

}

/* ---------- due dates ---------- */
function expiryOf(it) {
  const t = T[it.type]; if (!t || !t.exp) return null;
  const v = it.fields && it.fields[t.exp]; if (!v) return null;
  const fd = t.fields.find(x => x.k === t.exp);
  return fd.t === 'mmyy' ? parseMMYY(v) : parseDate(v);
}
function dueInfo(it) {
  const e = expiryOf(it); if (!e) return null;
  const t = T[it.type]; const L = t.due || 'Expires';
  const days = Math.round((e - today0()) / DAY);
  let cls, txt, short;
  if (days < 0) { cls = t.ends ? 'ended' : 'expired'; txt = `${t.past || 'Expired'} ${fmtDate(e)}`; short = t.ends ? 'Ended' : `${-days} d overdue`; }
  else if (days === 0) { cls = 'soon'; txt = `${L} today`; short = 'Today'; }
  else if (days <= 30) { cls = 'soon'; txt = `${L} in ${days} day${days > 1 ? 's' : ''}`; short = `${days} d`; }
  else if (days <= 90) { cls = 'upcoming'; txt = `${L} in ${days} days`; short = `${days} d`; }
  else { cls = 'ok'; txt = `${L} ${fmtDate(e)}`; short = e.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' }); }
  return { date: e, days, cls, txt, short, attention: cls === 'expired' || cls === 'soon' };
}
function allDue() { return S.vault.items.map(it => ({ it, d: dueInfo(it) })).filter(x => x.d).sort((a, b) => a.d.days - b.d.days); }
const attentionCount = () => allDue().filter(x => x.d.attention).length;

function toast(msg) {

}
function modal({ title, html = '', actions = [{ label: 'OK', value: true, cls: 'primary' }], onOpen }) {
  return new Promise(res => {
    const tt = $('.toast'); if (tt) tt.classList.remove('show');
    const ov = document.createElement('div'); ov.className = 'modal-ov';
    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div class="modal-body">${html}</div><div class="modal-actions">${actions.map((a, i) => `<button type="button" class="btn ${a.cls || ''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div></div>`;
    const close = v => { ov.remove(); res(v); };
    ov.addEventListener('click', e => {
      if (e.target === ov) return close(null);
      const b = e.target.closest('[data-i]'); if (!b) return;
      const a = actions[+b.dataset.i]; const v = typeof a.value === 'function' ? a.value(ov) : a.value;
      if (v !== undefined) close(v);
    });
    ov.addEventListener('keydown', e => {
      if (e.key === 'Escape') close(null);
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); const p = ov.querySelector('.btn.primary,.btn.danger'); p && p.click(); }
    });
    document.body.appendChild(ov);
    const first = ov.querySelector('input') || ov.querySelector('.btn.primary'); first && first.focus();
    onOpen && onOpen(ov);
  });
}

  if (p1 !== p2) { err.textContent = 'The two passphrases don’t match.'; return; }
  const btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Creating your cabinet…';
  const salt = crypto.getRandomValues(new Uint8Array(16));
  S.key = await deriveKey(p1, salt, ITER);
  S.meta = { v: 1, salt, iter: ITER, created: Date.now() };
  S.vault = newVault();
  await kvSet('meta', S.meta); await saveVault(false);
  S.hasVault = true; S.last = Date.now();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  if (location.hash !== '#/') location.hash = '#/'; else render();
}
async function onUnlock(form) {
  const p = $('#p1').value, err = $('#err'); if (!p) return;
  const btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Unlocking…'; err.textContent = '';
  try {
    const meta = await kvGet('meta'); const rec = await kvGet('vault');
    const key = await deriveKey(p, meta.salt, meta.iter);
    let vault; try { vault = JSON.parse(dec.decode(await decryptBytes(key, rec))); } catch { throw new Error('That passphrase didn’t open the cabinet.'); }
    vault.deleted = vault.deleted || {}; vault.settings = vault.settings || { autoLock: 5 };
    S.key = key; S.meta = meta; S.vault = vault; S.last = Date.now();
    let migrated = 0; for (const it of vault.items) if (migrateItem(it)) { it.updated = Date.now(); migrated++; }
    let rescued = 0; for (const it of vault.items) if (rescueTitle(it)) { it.updated = Date.now(); rescued++; }
    if (migrated && !rescued) await saveVault();
    if (rescued) { await saveVault(); setTimeout(() => toast(`Moved ${rescued} ID number${rescued > 1 ? 's' : ''} out of document labels so ${rescued > 1 ? 'they stay' : 'it stays'} hidden`), 400); }
    cleanupOrphans().catch(() => {});
    render();
  } catch (e) {
    btn.disabled = false; btn.innerHTML = `${icon('lock')} Unlock`; err.textContent = e.message; $('#p1').select();
  }
}

const ID_LIKE = { pan: /^[A-Z]{5}\d{4}[A-Z]$/, aadhaar: /^[2-9]\d{11}$/, passport: /^[A-Z]\d{7}$/, voter: /^[A-Z]{3}\d{7}$/, dl: /^[A-Z]{2}\d{2}[0-9A-Z]{9,13}$/, credit: /^\d{13,19}$/, debit: /^\d{13,19}$/, bank: /^\d{9,18}$/ };

}
const MOVED_FIELDS = { voter: [['constituency', 'Constituency'], ['part', 'Part no.']] };
function migrateItem(it) {   // returns true if it changed the item
  let ch = false;
  for (const [k, l] of MOVED_FIELDS[it.type] || []) {
    const v = it.fields && it.fields[k]; if (!v) continue;
    it.custom = it.custom || []; if (!it.custom.some(c => c.l === l && c.v === v)) it.custom.push({ l, v });
    delete it.fields[k]; ch = true;
  }
  return ch;
}
function rescueTitle(it) {   // returns true if it changed the item
  const t = T[it.type]; if (!t || !it.title) return false;

  const tn = idNorm(it.title); const kf = t.fields.find(x => x.k === t.key);
  let changed = false;
  if (kf && isSecret(kf) && !it.fields[t.key] && ID_LIKE[it.type] && ID_LIKE[it.type].test(tn)) {
    it.fields[t.key] = it.type === 'aadhaar' ? `${tn.slice(0, 4)} ${tn.slice(4, 8)} ${tn.slice(8)}` : (kf.t === 'card' ? tn : it.title.trim().toUpperCase());
    changed = true;
  }
  if (t.fields.some(fd => isSecret(fd) && it.fields[fd.k] && idNorm(it.fields[fd.k]) === tn)) { it.title = defaultTitle(it); changed = true; }
  return changed;
}

}

    const dr = S.draft; if (!dr) return; const id = el.dataset.id;
    syncDraft($('form[data-form=item]'));
    dr.item.attachments = dr.item.attachments.filter(a => a.id !== id);
    if (dr.added.has(id)) { dr.added.delete(id); delAtt(id); }
    const z = $('#att-zone'); z.innerHTML = attZone(dr); loadThumbs(z);
    const sb = $('#scan-atts'); if (sb) sb.innerHTML = scanAttsBtn(dr.item);
  },
  'del-item': async el => {
    const it = itemById(el.dataset.id); const n = (it.attachments || []).length;
    if (!await confirmM('Delete this document?', `“${it.title}”${n ? ` and its ${n} scan${n > 1 ? 's' : ''}` : ''} will be removed from this device.`, 'Delete', true)) return;
    S.vault.items = S.vault.items.filter(x => x.id !== it.id); S.vault.deleted[it.id] = Date.now();
    for (const a of it.attachments || []) await delAtt(a.id);
    await saveVault(); location.hash = '#/d/' + encodeURIComponent(it.drawerId); toast('Deleted');
  },
  ics: el => { const it = itemById(el.dataset.id); download(new Blob([icsWrap([icsEvent(it)])], { type: 'text/calendar' }), `${it.title.replace(/[^\w\- ]+/g, '').trim() || 'renewal'}.ics`); toast('Open the file to add it to your calendar'); },
  'ics-all': () => { const evs = allDue().filter(x => x.d.days >= 0).map(x => icsEvent(x.it)); download(new Blob([icsWrap(evs)], { type: 'text/calendar' }), 'tijori-renewals.ics'); toast(`${evs.length} reminders ready — open the file`); },
  'new-drawer': async () => {
    const r = await drawerModal('New drawer'); if (!r) return;
    S.vault.drawers.push({ id: uid(), ...r, order: Math.max(0, ...S.vault.drawers.map(d => d.order ?? 0)) + 1, builtin: false });
    await saveVault(); render(); toast('Drawer added');
  },
  'rename-drawer': async el => {
    const d = drawerById(el.dataset.id); const r = await drawerModal('Edit drawer', d); if (!r) return;
    Object.assign(d, r); await saveVault(); render();
  },
  'delete-drawer': async el => {
    const d = drawerById(el.dataset.id);
    if (S.vault.items.some(i => i.drawerId === d.id)) return toast('Empty the drawer first');
    if (!await confirmM('Remove drawer?', `“${d.name}” is empty and will be removed.`, 'Remove', true)) return;
    S.vault.drawers = S.vault.drawers.filter(x => x.id !== d.id); await saveVault(); render();
  },
  'scan-atts': async () => {
    if (!S.draft) return; syncDraft($('form[data-form=item]'));
    const atts = S.draft.item.attachments.filter(scannable);
    if (atts.length) await scanFiles(atts.map(fromAtt));
  },
  'read-atts': el => { S.autoReadAtts = el.dataset.id; location.hash = '#/edit/' + el.dataset.id; },
  'reload-app': async () => {
    if (S.draft && !await confirmM('Reload now?', 'Anything you haven’t saved in this form will be lost.', 'Reload', false)) return;
    location.reload();
  },
  'dismiss-upd': () => { const b = $('.upd'); if (b) b.remove(); },
  'check-update': () => {
    const c = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (!c) return toast('Updates work when Tijori is opened from its web address or installed.');
    toast('Checking for updates…'); c.postMessage({ type: 'check-update' });
  },
  'c-add': el => {
    if (!S.draft) return; syncDraft($('form[data-form=item]'));
    S.draft.item.custom = [...(S.draft.item.custom || []), { l: el.dataset.l || '', v: '' }]; renderCustom(true);
  },
  'c-del': el => {
    if (!S.draft) return; syncDraft($('form[data-form=item]'));
    S.draft.item.custom.splice(+el.dataset.ix, 1); renderCustom(false);
  },
  'copy-c': el => { const it = itemById(el.dataset.id); const c = it && (it.custom || [])[+el.dataset.ix]; if (c) return copyText(c.v); },
  'pick-owner': el => {
    const inp = $('#f-owner'); if (!inp) return;
    const same = inp.value.trim().toLowerCase() === el.dataset.o.toLowerCase();
    inp.value = same ? '' : el.dataset.o;           // tap again to clear
    $('#ochips').innerHTML = ownerChips(inp.value);
    syncDraft(inp.form);
  },
  'ocr-remove': async () => {
    if (!await confirmM('Remove the scanner download?', `Frees about ${Math.round(OCR_BYTES / 1e6)} MB. Scan to fill downloads it again the next time you use it.`, 'Remove', true)) return;
    await caches.delete('tijori-ocr-v1'); S.vault.settings.ocrOk = false; await saveVault(false); fillScanner(); toast('Scanner download removed');
  },
  'share-atts': async el => {
    const it = itemById(el.dataset.id); const atts = it.attachments || []; if (!atts.length) return;
    el.disabled = true;
    try {
      const files = (await Promise.all(atts.map((a, i) => attFile(a, it.title, i, atts.length)))).filter(Boolean);
      await shareFiles(files, it.title);
    } finally { el.disabled = false; }
  },
  export: async el => {
    el.disabled = true; let json; const now = Date.now();
    try {
      const blobs = {};
      for (const k of await blobKeys()) { const r = await blobGet(k); blobs[k] = { iv: b64(r.iv), ct: b64(r.ct) }; }
      const v = await encryptBytes(S.key, enc.encode(JSON.stringify({ ...S.vault, lastBackup: now })));
      json = JSON.stringify({ app: 'tijori', format: 1, exported: new Date(now).toISOString(), kdf: { salt: b64(S.meta.salt), iter: S.meta.iter }, vault: { iv: b64(v.iv), ct: b64(v.ct) }, blobs });
    } finally { el.disabled = false; }
    const date = isoDate(new Date(now));
    // Browsers only let a short list of file types be shared, so the shared copy is a .txt (same contents; Import accepts it).
    const shareFile = new File([json], `tijori-backup-${date}.txt`, { type: 'text/plain' });
    const canShare = canShareFiles([shareFile]);
    const n = S.vault.items.length, scans = S.vault.items.reduce((s, i) => s + (i.attachments || []).length, 0);
    const choice = await modal({ title: 'Backup ready',
      html: `<p>${n} document${n === 1 ? '' : 's'} and ${scans} scan${scans === 1 ? '' : 's'}, ${fmtSize(json.length)}, encrypted with your passphrase.</p>
        <p>Keep it off this device as well, on your laptop or a USB drive, so it survives a lost phone.</p>
        ${canShare ? '<p class="small">“Send to…” opens your share sheet: Quick Share, AirDrop, Files or any app you choose. The file stays encrypted wherever it goes.</p>' : ''}`,
      actions: [{ label: 'Cancel', value: null }, { label: 'Save to Downloads', value: 'dl', cls: canShare ? '' : 'primary' }, ...(canShare ? [{ label: 'Send to…', value: 'share', cls: 'primary' }] : [])] });
    if (!choice) return;
    if (choice === 'dl') download(new Blob([json], { type: 'application/octet-stream' }), `tijori-backup-${date}.tijori`);
    else if (!(await shareFiles([shareFile], 'Tijori backup'))) return;
    S.vault.lastBackup = now; await saveVault(false); render();
    toast(choice === 'dl' ? 'Backup saved to Downloads' : 'Backup sent');
  },
  'change-pass': async () => {
    const r = await modal({ title: 'Change passphrase',
      html: `<div class="mf"><label>Current passphrase<input type="password" id="cp0" autocomplete="off"></label><label>New passphrase<input type="password" id="cp1" autocomplete="off"></label><label>Repeat new passphrase<input type="password" id="cp2" autocomplete="off"></label><div class="err" id="cperr"></div></div>`,
      actions: [{ label: 'Cancel', value: null }, { label: 'Change', cls: 'primary', value: ov => { const a = ov.querySelector('#cp0').value, b = ov.querySelector('#cp1').value, c = ov.querySelector('#cp2').value, er = ov.querySelector('#cperr'); if (b.length < 8) { er.textContent = 'Use at least 8 characters.'; return; } if (b !== c) { er.textContent = 'New passphrases don’t match.'; return; } return { a, b }; } }] });
    if (!r) return;
    toast('Re-encrypting your cabinet…');
    const k0 = await deriveKey(r.a, S.meta.salt, S.meta.iter);
    try { await decryptBytes(k0, await kvGet('vault')); } catch { return toast('Current passphrase is wrong'); }
    const salt = crypto.getRandomValues(new Uint8Array(16)); const nk = await deriveKey(r.b, salt, ITER);
    const out = []; for (const k of await blobKeys()) out.push([k, await encryptBytes(nk, await decryptBytes(S.key, await blobGet(k)))]);
    const meta = { ...S.meta, salt, iter: ITER }; S.vault.updated = Date.now();
    const vr = await encryptBytes(nk, enc.encode(JSON.stringify(S.vault)));
    const d = await db();
    await new Promise((res, rej) => { const tx = d.transaction(['kv', 'blobs'], 'readwrite'); tx.objectStore('kv').put(meta, 'meta'); tx.objectStore('kv').put(vr, 'vault'); const bs = tx.objectStore('blobs'); for (const [k, v] of out) bs.put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
    S.key = nk; S.meta = meta; toast('Passphrase changed. Old backups still open with the old one.');
  },
  persist: async () => { const ok = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; toast(ok ? 'The browser will keep your cabinet' : 'The browser declined — installing the app usually helps'); fillStorage(); },
  wipe: async () => {
    const ok = await modal({ title: 'Erase this cabinet?', html: `<p>This permanently deletes every document and scan stored in this browser. Type <b>ERASE</b> to confirm.</p><div class="mf"><input id="wipe-in" autocomplete="off" autocapitalize="characters"></div>`,
      actions: [{ label: 'Cancel', value: false }, { label: 'Erase everything', cls: 'danger', value: ov => ov.querySelector('#wipe-in').value.trim() === 'ERASE' ? true : undefined }] });
    if (!ok) return;
    S.draft = null; (await db()).close(); dbp = null;
    await new Promise(res => { const r = indexedDB.deleteDatabase(DB_NAME); r.onsuccess = r.onerror = r.onblocked = () => res(); });
    S.hasVault = false; lock(); history.replaceState(null, '', '#/');
  },
};

function mergeVault(cur, inc) {
  cur.deleted = cur.deleted || {}; const st = { added: 0, updated: 0, removed: 0 };
  for (const [id, ts] of Object.entries(inc.deleted || {})) if (!cur.deleted[id] || cur.deleted[id] < ts) cur.deleted[id] = ts;
  for (const d of inc.drawers || []) if (!cur.drawers.some(x => x.id === d.id)) cur.drawers.push(d);
  for (const it of inc.items || []) {
    const i = cur.items.findIndex(x => x.id === it.id);
    if (i < 0) { if ((cur.deleted[it.id] || 0) >= (it.updated || 0)) continue; cur.items.push(it); st.added++; }
    else if ((it.updated || 0) > (cur.items[i].updated || 0)) { cur.items[i] = it; st.updated++; }
  }
  const before = cur.items.length;
  cur.items = cur.items.filter(it => !((cur.deleted[it.id] || 0) > (it.updated || 0)));
  st.removed = before - cur.items.length;
  for (const it of cur.items) if (!cur.drawers.some(d => d.id === it.drawerId)) it.drawerId = cur.drawers[0].id;
  return st;
}
async function importBackup(file) {
  let b; try { b = JSON.parse(await file.text()); } catch {}
  if (!b || b.app !== 'tijori' || !b.vault) return toast('That isn’t a Tijori backup file');
  const salt = unb64(b.kdf.salt); const rec = { iv: unb64(b.vault.iv), ct: unb64(b.vault.ct) };
  let key = null, vault = null;
  if (eqBytes(salt, S.meta.salt)) { try { vault = JSON.parse(dec.decode(await decryptBytes(S.key, rec))); key = S.key; } catch {} }
  while (!vault) {
    const pass = await passModal('Backup passphrase', 'Enter the passphrase used on the device this backup came from.');
    if (pass === null) return;
    try { key = await deriveKey(pass, salt, b.kdf.iter); vault = JSON.parse(dec.decode(await decryptBytes(key, rec))); }
    catch { toast('That passphrase didn’t open the backup'); }
  }
  toast('Merging…');
  const st = mergeVault(S.vault, vault);
  for (const it of S.vault.items) migrateItem(it);
  const need = new Set(); S.vault.items.forEach(it => (it.attachments || []).forEach(a => { need.add(a.id); if (a.thumb) need.add(a.id + ':t'); }));
  const have = new Set(await blobKeys());
  for (const k of need) {
    if (have.has(k) || !b.blobs || !b.blobs[k]) continue;
    const pt = await decryptBytes(key, { iv: unb64(b.blobs[k].iv), ct: unb64(b.blobs[k].ct) });
    await blobSet(k, await encryptBytes(S.key, pt));
  }
  await saveVault(); await cleanupOrphans(); render();
  await modal({ title: 'Backup imported', html: `<p>${st.added} new document${st.added === 1 ? '' : 's'} added, ${st.updated} updated${st.removed ? `, ${st.removed} removed (deleted on the other device)` : ''}.</p>` });
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); e.stopPropagation();
  try { await fn(el, e); } catch (err) { console.error(err); toast(err.message || 'Something went wrong'); }
});
document.addEventListener('change', async e => {
  const el = e.target, c = el.dataset && el.dataset.change; if (!c) return;
  try {
    if (c === 'att') { const files = [...el.files]; el.value = ''; await addFiles(files); }
    else if (c === 'scan') { const files = [...el.files]; el.value = ''; if (files.length) await scanFiles(files.map(fromFile)); }
    else if (c === 'import') { const file = el.files[0]; el.value = ''; if (file) await importBackup(file); }
    else if (c === 'move') { const it = itemById(el.dataset.id); it.drawerId = el.value; it.updated = Date.now(); await saveVault(); const d = drawerById(el.value); render(); toast(`Moved to ${d.name}`); }
    else if (c === 'autolock') { S.vault.settings.autoLock = +el.value; await saveVault(false); toast(`Locks after ${el.value} min idle`); }
  } catch (err) { console.error(err); toast(err.message || 'Something went wrong'); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { S.q = el.value; $('#results').innerHTML = searchResults(el.value); return; }
  if (el.id === 'p1' && $('#sbar')) { const s = strength(el.value); const b = $('#sbar'); b.style.width = s + '%'; b.style.background = s < 40 ? 'var(--red)' : s < 70 ? 'var(--amber)' : 'var(--green)'; }
  if (el.dataset.fmt === 'card') { const d = el.value.replace(/\D/g, '').slice(0, 19); el.value = d.replace(/(.{4})/g, '$1 ').trim(); }
  if (el.dataset.fmt === 'mmyy') { let d = el.value.replace(/\D/g, '').slice(0, 4); if (d.length >= 3) d = d.slice(0, 2) + '/' + d.slice(2); el.value = d; }
  const form = el.closest && el.closest('form[data-form=item]');
  if (el.id === 'f-owner' && $('#ochips')) $('#ochips').innerHTML = ownerChips(el.value);
  if (form && S.draft) {
    if (el.name === 'f_expiry') el.dataset.manual = el.value ? '1' : '';
    if (S.draft.item.type === 'warranty' && (el.name === 'f_purchase' || el.name === 'f_months')) autoWarranty(form);
    syncDraft(form);
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target, k = form.dataset.form;
  try { if (k === 'item') await saveDraft(form); else if (k === 'unlock') await onUnlock(form); else if (k === 'setup') await onSetup(form); }
  catch (err) { console.error(err); toast(err.message || 'Something went wrong'); }
});
window.addEventListener('hashchange', () => { if (S.key) render(); });

/* auto-lock + hide contents in the app switcher */
['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(ev => addEventListener(ev, () => { S.last = Date.now(); }, { passive: true }));
setInterval(() => { if (S.key && Date.now() - S.last > (S.vault.settings.autoLock || 5) * 60000) lock('Locked after inactivity.'); }, 10000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { S.hiddenAt = Date.now(); document.body.classList.add('veil'); }
  else {
    document.body.classList.remove('veil');
    if (S.key && S.hiddenAt && Date.now() - S.hiddenAt > 60000) lock('Locked while you were away.');
  }
});

/* ---------- updates ---------- */
function updateReady() {
  const p1 = $('#p1');
  if (!S.key && !(p1 && p1.value)) { location.reload(); return; }   // on the lock screen with nothing typed: just load the new version
  if ($('.upd')) return;
  const b = document.createElement('div'); b.className = 'upd'; b.setAttribute('role', 'status');
  b.innerHTML = `<span class="grow"><b>A new version of Tijori is ready</b><br><small>Reload to start using it.</small></span><button class="btn sm primary" data-act="reload-app">Reload</button><button class="ib" data-act="dismiss-upd" aria-label="Later">${icon('x')}</button>`;
  document.body.appendChild(b);
}

// Listen before anything else: the service worker may announce a new version while the page is still starting.
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) updateReady(); });
  navigator.serviceWorker.addEventListener('message', e => {
    const t = e.data && e.data.type;
    if (t === 'tijori-update') updateReady();
    else if (t === 'tijori-current') toast(`You have the latest version (${APP_VERSION})`);
    else if (t === 'tijori-update-error') toast('Couldn’t check for updates. Are you online?');
  });
  navigator.serviceWorker.startMessages();
}

/* ---------- boot ---------- */
(async function init() {
  if (!window.indexedDB || !window.crypto || !crypto.subtle) {
    app.innerHTML = `<main class="lock"><div class="lock-card"><div class="lock-art">${CAB_SVG}</div><h1>Tijori</h1><p class="sub">This browser can’t run the cabinet from here. It needs secure storage and encryption, which most browsers allow only for installed or https pages. Open it in Chrome or Edge, or host it as described in the README.</p></div></main>`;
    return;
  }
  try { S.hasVault = !!(await kvGet('meta')); }
  catch {
    app.innerHTML = `<main class="lock"><div class="lock-card"><div class="lock-art">${CAB_SVG}</div><h1>Tijori</h1><p class="sub">This browser blocks storage for this page (private mode, or a local file in Safari/Firefox). Open it in Chrome or Edge, or install it from your own https site.</p></div></main>`;
    return;
  }
  showLock();
  if (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
})();
</script>
